[project]
name = "switch2-autoplay"
version = "0.1.0"
description = "Give a model eyes and hands so it can play the owner's own Nintendo Switch 2."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyserial",
    "pyyaml",
    "opencv-python; sys_platform == 'win32'",
    "opencv-python-headless; sys_platform != 'win32'",
    "av>=18.1.0",
]

[project.scripts]
ap = "autoplay.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]
hw = ["hidapi", "esptool"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
